name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the newest uploaded zip and unpack only it
        run: |
          best=""
          bt=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            [ -z "$t" ] && t=0
            echo "found: $f (uploaded at $t)"
            if [ "$t" -gt "$bt" ]; then bt=$t; best="$f"; fi
          done < <(find . -name '*.zip' -not -path './.git/*')
          echo "USING: $best"
          unzip -q -o "$best"
          echo "--- check ---"
          grep -n "zxing" app/build.gradle || echo "NO zxing in build.gradle"
          grep -c "importWps" app/src/main/java/com/example/gps72/GpsView.java || true
          cat zipver.txt || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPS72-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
